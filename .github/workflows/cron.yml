# Calls the Outreach Sender scheduler every 10 minutes.
# Set repository secrets: CRON_URL (e.g. https://your-app.vercel.app/api/cron) and CRON_SECRET.
name: Outreach scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: outreach-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_URL / CRON_SECRET secrets are not set — skipping."; exit 0
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" "$CRON_URL")
          echo "HTTP $code"; head -c 2000 response.json; echo
          test "$code" = "200"
